<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>happybee71 的个人主页</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            background: url("bg.jpg") center/cover no-repeat fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Microsoft Yahei;
        }
        .box{
            background: rgba(255,255,255,0.95);
            padding: 50px 40px;
            border-radius: 25px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .avatar{
            width: 120px;
            height: 120px;
            background: #764ba2;
            border-radius: 50%;
            margin: 0 auto 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            color: white;
        }
        h1{
            font-size: 28px;
            color: #2c3e50;
            margin-bottom: 15px;
        }
        .info{
            color: #555;
            line-height: 1.8;
            font-size: 16px;
            margin-bottom: 30px;
        }
        .btn{
            display: inline-block;
            padding: 12px 30px;
            background: linear-gradient(135deg,#667eea,#764ba2);
            color: white;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
        }
        .btn:hover{
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(102,126,234,0.35);
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="avatar">🐝</div>
        <h1>你好，我是happybee71</h1>
        <div class="info">
            欢迎来到我的个人主页<br>
            热爱学习，探索趣味编程
        </div>
        <!-- 这里的按钮已经直接跳转到你的编程猫社区主页啦！ -->
        <a href="https://shequ.codemao.cn/user/10358868" class="btn" target="_blank">进入我的主页</a>
    </div>
</body>
</html>
