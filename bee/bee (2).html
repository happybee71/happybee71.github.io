<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>happybee71个人主页</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            background: url("bg.jpg") center/cover no-repeat fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Microsoft Yahei;
        }
        .main-card{
            background: rgba(255,255,255,0.92);
            padding: 45px 35px;
            border-radius: 22px;
            box-shadow: 0 8px 28px rgba(0,0,0,0.18);
            text-align: center;
            width: 90%;
            max-width: 480px;
        }
        .avatar{
            width: 110px;
            height: 110px;
            border-radius: 50%;
            margin: 0 auto 20px;
            background: #764ba2;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:42px;
            color:#fff;
        }
        h1{
            color:#2c3e50;
            font-size:26px;
            margin-bottom:12px;
        }
        .desc{
            color:#666;
            line-height:1.7;
            font-size:16px;
            margin-bottom:28px;
        }
        .link-btn{
            display:inline-block;
            padding:11px 28px;
            background:linear-gradient(135deg,#667eea,#764ba2);
            color:#fff;
            text-decoration:none;
            border-radius:30px;
            transition:0.3s;
        }
        .link-btn:hover{
            transform:translateY(-3px);
            box-shadow:0 6px 15px rgba(102,126,234,0.35);
        }
    </style>
</head>
<body>
    <div class="main-card">
        <div class="avatar">🐝</div>
        <h1>你好，我是happybee71</h1>
        <p class="desc">欢迎来到我的个人主页<br>热爱学习，探索趣味编程</p>
        <a href="https://github.com/happybee71" class="link-btn" target="_blank">进入我的主页</a>
    </div>
</body>
</html>
