<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>happybee71 个人主页</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
        body{
            width:100vw;height:100vh;
            background:#7377ed;
            display:flex;
            justify-content:center;
            align-items:center;
        }
        .card{
            width:360px;
            padding:40px 30px;
            background:#fff;
            border-radius:20px;
            box-shadow:0 8px 30px rgba(0,0,0,0.12);
            text-align:center;
        }
        .avatar{
            width:90px;height:90px;
            border-radius:50%;
            background:linear-gradient(135deg,#8074e8,#b088f0);
            margin:0 auto 20px;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:40px;
        }
        h1{
            font-size:26px;
            color:#222;
            margin-bottom:16px;
        }
        .desc{
            color:#555;
            line-height:1.8;
            margin-bottom:30px;
        }
        .btns{
            display:flex;
            gap:14px;
            justify-content:center;
        }
        button{
            padding:12px 26px;
            border:none;
            border-radius:30px;
            font-size:15px;
            cursor:pointer;
            color:#fff;
            transition: opacity 0.2s;
        }
        button:hover{opacity:0.85;}
        .btn1{background:#7368e6;}
        .btn2{background:#39a857;}
    </style>
</head>
<body>
    <div class="card">
        <div class="avatar">🐝</div>
        <h1>你好，我是happybee71</h1>
        <div class="desc">
            欢迎来到我的个人主页<br>
            热爱学习，探索趣味编程<br>
            喜欢Minecraft、各类游戏开发
        </div>
        <div class="btns">
            <button class="btn1">编程猫主页</button>
            <!-- 点击MC按钮跳转 mcjs.cc，新标签页打开 -->
            <button class="btn2" onclick="window.open('https://mcjs.cc/','_blank')">MC</button>
        </div>
    </div>
</body>
</html>
