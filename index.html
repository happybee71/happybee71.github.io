<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>我的个人主页</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box; font-family:微软雅黑;}
        body{
            background: linear-gradient(135deg,#4facfe,#00f2fe);
            color:#fff;
            text-align:center;
            padding:60px 20px;
        }
        .box{
            background:rgba(255,255,255,0.2);
            border-radius:20px;
            padding:40px;
            max-width:600px;
            margin:20px auto;
            box-shadow:0 8px 30px rgba(0,0,0,0.15);
        }
        h1{font-size:36px;margin-bottom:15px;}
        .info{font-size:18px;line-height:2; margin:20px 0;}
        .btn{
            display:inline-block;
            padding:12px 30px;
            background:#fff;
            color:#4facfe;
            text-decoration:none;
            border-radius:30px;
            font-weight:bold;
            margin:8px;
            transition:0.3s;
            cursor:pointer;
            border:none;
        }
        .btn:hover{transform:scale(1.05);}
        input, textarea{
            width:100%;
            padding:12px;
            margin:8px 0;
            border:none;
            border-radius:10px;
            font-size:16px;
        }
        .message{
            background:rgba(255,255,255,0.3);
            padding:15px;
            margin:10px 0;
            border-radius:10px;
            text-align:left;
        }
        .hide{display:none;}
    </style>
</head>
<body>
    <div class="box">
        <h1>你好，我是小创作者</h1>
        <div class="info">
            <p>爱好：编程、小游戏制作</p>
            <p>擅长：Python、坦克大战、网页制作</p>
            <p>热爱动手创造有趣作品</p>
        </div>

        <a class="btn" href="javascript:alert('欢迎来访！')">欢迎留言</a>
        <a class="btn" href="https://shequ.codemao.cn/user/10358868" target="_blank">查看作品</a>
        <a class="btn" href="https://shequ.codemao.cn/discover" target="_blank">编程猫社区</a>
        <button class="btn" onclick="switchMsg()">查看留言</button>
    </div>

    <div class="box">
        <h2>📝 留言板</h2>
        <br>
        <input type="text" id="name" placeholder="输入你的名字">
        <textarea id="msg" rows="3" placeholder="输入留言内容"></textarea>
        <button class="btn" onclick="sendMsg()">提交留言</button>

        <div id="msgList" class="hide"></div>
    </div>

    <script>
        let msgShow = false;
        function switchMsg(){
            let list = document.getElementById("msgList");
            msgShow = !msgShow;
            if(msgShow){
                list.classList.remove("hide");
            }else{
                list.classList.add("hide");
            }
        }

        function sendMsg(){
            let name = document.getElementById("name").value;
            let msg = document.getElementById("msg").value;
            if(!name || !msg){ alert("请填写完整！"); return; }
            
            let newMsg = `
            <div class="message">
                <strong>${name}</strong><br>${msg}
            </div>`;
            
            document.getElementById("msgList").innerHTML += newMsg;
            document.getElementById("name").value = "";
            document.getElementById("msg").value = "";
        }
    </script>
</body>
</html>
